// LsmWebGame — 狼人杀 WS 帧定义
//
// 狼人杀专用帧类型（type 字段以 "game.werewolf_" 开头）
//
//   client → server
//     game.werewolf_action          WerewolfActionReq
//     game.werewolf_vote            WerewolfVoteReq
//     game.werewolf_suicide         WerewolfSuicideReq
//     game.werewolf_shoot           WerewolfShootReq
//     game.werewolf_sheriff         WerewolfSheriffReq
//     game.werewolf_finish          WerewolfFinishReq
//     game.werewolf_sheriff_stream  WerewolfSheriffStreamReq
//     game.werewolf_idiot_reveal    WerewolfIdiotRevealReq
//     game.werewolf_restart_vote    WerewolfRestartVoteReq
//     game.werewolf_last_words      WerewolfLastWordsReq
//     game.werewolf_use_prop        WerewolfUsePropReq
//     game.werewolf_propose_vote    WerewolfProposeVoteReq
//     game.werewolf_pause           WerewolfPauseReq
//
//   server → client
//     game.state               ClientGameState（大状态，见 state.proto）
//     game.over                GameOver（通用）
//     game.werewolf_prop_used  PropUsedEvent
//     game.sheriff_stream_settle SheriffStreamSettle
//     game.idiot_revealed      IdiotRevealed
//     game.restart_vote_update RestartVoteUpdate
//     game.settlement          SettlementInfo
//     game.pre_wait            PreWaitInfo

syntax = "proto3";

package lsm.game.werewolf;

import "game/werewolf/roles.proto";

option go_package = "LsmWebGame/proto/pb/game/werewolf";

// ─────────────────── 客户端请求 ───────────────────

// 夜间动作请求（wolf_kill / seer_check / witch_act / guard_protect / knight_duel / demon_hunter_hunt）
message WerewolfActionReq {
  string room_id = 1;
  string action_type = 2;  // "wolf_kill" | "seer_check" | "witch_act" | "guard_protect" | "knight_duel" | "demon_hunter_hunt"
  int32 target_seat = 3;   // 目标座位，-1 表示无目标/空守/不使用
  // witch 专用
  bool witch_use_heal = 4;
  bool witch_use_poison = 5;
  int32 witch_poison_target = 6;
}

// 投票请求（白天投票 / 警长投票）
message WerewolfVoteReq {
  string room_id = 1;
  int32 target_seat = 2;  // -1 = 弃权
  string vote_type = 3;   // "day" | "sheriff" | "sheriff_final"
}

// 狼人自爆
message WerewolfSuicideReq {
  string room_id = 1;
}

// 猎人开枪
message WerewolfShootReq {
  string room_id = 1;
  int32 target_seat = 2;
}

// 警长动作
message WerewolfSheriffReq {
  string room_id = 1;
  string action = 2;  // "candidate" | "vote" | "elect" | "resign"
  int32 target_seat = 3;
}

// 阶段完成（发言结束 / 投票结束 / 开始白天）
message WerewolfFinishReq {
  string room_id = 1;
  string finish_type = 2;  // "speak" | "vote" | "start_day"
}

// 警徽流声明
message WerewolfSheriffStreamReq {
  string room_id = 1;
  int32 first_seat = 2;   // 第一顺位
  int32 second_seat = 3;  // 第二顺位
  bool withdraw = 4;      // 撤回警徽流
}

// 白痴翻牌选择
message WerewolfIdiotRevealReq {
  string room_id = 1;
  bool reveal = 2;  // true=翻牌，false=不翻（默认翻）
}

// 重开局投票
message WerewolfRestartVoteReq {
  string room_id = 1;
  bool agree = 2;
}

// 遗言提交
message WerewolfLastWordsReq {
  string room_id = 1;
  string text = 2;
  bool skip = 3;  // true = 放弃遗言
}

// 使用道具
message WerewolfUsePropReq {
  string room_id = 1;
  string prop_key = 2;
  int32 target = 3;  // 目标座位，-1 = AOE
}

// 发起投票（预言家等角色）
message WerewolfProposeVoteReq {
  string room_id = 1;
  string propose_type = 2;
  int32 target_seat = 3;
}

// 暂停/恢复游戏
message WerewolfPauseReq {
  string room_id = 1;
  bool pause = 2;  // true=暂停，false=恢复
}

// ─────────────────── 服务端响应 ───────────────────

// 道具使用公开广播
message PropUsedEvent {
  int32 from_seat = 1;
  string from_nickname = 2;
  string prop_key = 3;
  string prop_name = 4;
  int32 target_seat = 5;  // -1 = AOE 全体
  bool hit = 6;
  string effect_desc = 7;
}

// 警徽流结算
message SheriffStreamSettle {
  int32 sheriff_seat = 1;
  int32 first_seat = 2;
  int32 second_seat = 3;
  bool active = 4;
}

// 白痴翻牌结果
message IdiotRevealed {
  int32 seat = 1;
  bool revealed = 2;
  Role role = 3;
}

// 重开局投票增量更新
message RestartVoteUpdate {
  int32 agree_count = 1;
  int32 total_count = 2;
  repeated int32 agree_seats = 3;
  // 剩余时间（秒）
  int32 remaining_sec = 4;
  // 是否通过
  bool passed = 5;
}

// 金池结算明细
message SettlementInfo {
  string room_id = 1;
  Faction winner_faction = 2;
  repeated int32 winner_seats = 3;
  repeated int32 loser_seats = 4;
  // 各座位结算详情
  map<int32, int64> seat_delta = 5;
  int64 pot_bonus = 6;
}

// 人类玩家等待窗口（提示正在等待其他玩家）
message PreWaitInfo {
  string room_id = 1;
  string waiting_for = 2;  // "other_players" | "human_wolf" | "day_action"
  int32 wait_sec = 3;
}
