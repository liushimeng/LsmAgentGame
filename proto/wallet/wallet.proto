// LsmAgentGame — 钱包模块消息定义
//
// 帧类型：
//   server → client
//     wallet.balance  WalletBalanceUpdate

syntax = "proto3";

package lsm.wallet;

option go_package = "LsmAgentGame/proto/pb/wallet";

// 钱包余额变动推送
message WalletBalanceUpdate {
  // 当前余额
  int64 balance = 1;
  // 变动量（正=增加，负=减少）
  int64 delta = 2;
  // 变动原因
  string reason = 3;
  // 关联的房间 ID（可选）
  string room_id = 4;
  // 变动时间（unix 毫秒）
  int64 ts = 5;
}
