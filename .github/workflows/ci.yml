# CI — 后端编译/测试 + 前端类型检查/构建 + 项目自检
#
# 2026-08-14 §20260814-01 U4 新增。
# 2026-08-21 §20260821-03 修复 CI #48 三 Job 全红,两个根因:
#   ① proto 生成产物(ServerGo/proto/pb/ 与 ClientWeb/src/proto/)被
#     .gitignore 排除,CI 全新 checkout 里不存在,而已提交源码 import 它们
#     → go build / tsc 必然失败。修复:两个 build Job 各插入 proto 生成步骤
#     (proto/gen.sh go|ts),protoc 钉 v28.3 与开发机一致。
#   ② Project conventions 的 §4 行数检查失败(werewolf-v2.css 超限 +
#     agent_runner.go baseline 恶化),随本批次代码修复一并解决。
#
# 网络环境说明(国内外双兼容):
#   - CI runner 在海外网络:protoc zip 走 GitHub Releases、Go 模块走默认
#     proxy.golang.org、npm 走默认 registry.npmjs.org,均为海外直达源。
#   - 开发机在国内网络:GOPROXY=goproxy.cn、npm registry=npmmirror
#     (见 ~/.npmrc / go env),rebuild_restart_app.sh 不经过本 workflow。
#   - package-lock.json 已入库且 resolved 指向国内镜像 npmmirror ——
#     这正是 CI 坚持 `npm install` 而非 `npm ci` 的原因:npm >= 8 会把异源
#     resolved 重写到当前 registry,海外 runner 因此走 npmjs.org;
#     而本地 rebuild_restart_app.sh 的 `npm ci` 依赖 resolved 里的国内镜像。
#
# # 为什么现在才有
#
# 待实施项文档 §1 明确留了这条:「CI 加 unparam + 自定义 lint(检测『声明未用的
# 函数参数』与『零写入点的 struct 字段』)可自动化拦截此类缺陷 ——
# **此项工程化改进本身待做**」。
#
# 在此之前 .github/ 下只有 dependabot / FUNDING / 模板,**零 workflow**。
# 也就是说仓库里那 3 个专门为根治 §130「声明了却从不接线」而写的 lint 测试
# (wiring_lint_test.go / wiring_lint_field_test.go / invariant_wiring_test.go)
# **从未在 CI 里跑过一次** —— 它们只在有人手动 go test 时生效。
# 而 CLAUDE.md 已四次记录「注释里的自检条款不会被执行」;
# 同理:**lint 写了不跑,与没写等价**。本 workflow 就是把它们真正接上。
#
# 编译与测试的硬约束依据 CLAUDE.md §4:
#   - 涉及 ServerGo/ 的提交,go test ./... 必须通过;
#   - 涉及 ClientWeb/ 的提交,tsc --noEmit 与 npm run build 必须成功。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的新 push 取消仍在跑的旧 run(省 CI 分钟数)。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 后端:编译 + 全量测试(含 3 个 §130 接线 lint)
  # ---------------------------------------------------------------------------
  backend:
    name: ServerGo (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 子模块不参与后端编译(CLAUDE.md §9:仅美术生成 / CDP 调试用),
          # 不 checkout 可省一大截克隆时间。
          submodules: false

      - uses: actions/setup-go@v5
        with:
          # 与 ServerGo/go.mod 的 `go 1.25.0` 对齐。
          go-version-file: ServerGo/go.mod
          cache-dependency-path: ServerGo/go.sum

      # ── §20260821-03:proto Go 产物现场生成(CI 失败根因①的修复) ──
      # protoc 钉 v28.3(与开发机 /tmp/protoc 完全一致,保证生成行为同源);
      # protoc-gen-go 钉 v1.34.2(与 go.mod 的 google.golang.org/protobuf
      # 同版本,防生成代码与运行时库漂移)。
      - name: Install protoc (pinned v28.3)
        run: |
          curl -fsSL -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v28.3/protoc-28.3-linux-x86_64.zip
          sudo unzip -oq /tmp/protoc.zip -d /usr/local/protoc
          echo "/usr/local/protoc/bin" >> "$GITHUB_PATH"
          /usr/local/protoc/bin/protoc --version

      - name: Install protoc-gen-go (pinned v1.34.2)
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.34.2

      - name: Generate proto Go code
        run: bash proto/gen.sh go

      - name: go build
        working-directory: ServerGo
        run: go build -o /tmp/LsmAgentGame main.go

      - name: go vet
        working-directory: ServerGo
        run: go vet ./...

      # 全量测试。这里同时跑到了三个「接线 lint」:
      #   TestWiring_U6_*/U7_*        — XxxBlock 有调用点 / skip 动作有派发 /
      #                                 夜间私有字段被读 / Agent 字段有 wired setter
      #   TestWiringLintField_*       — AST 扫描 Agent 私有引用字段的 setter
      #   TestInvariantWiring_*       — runtime invariant 的 Check* 有生产调用点
      - name: go test
        working-directory: ServerGo
        run: go test ./... -count=1

  # ---------------------------------------------------------------------------
  # 前端:类型检查 + 生产构建
  # ---------------------------------------------------------------------------
  frontend:
    name: ClientWeb (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 用 npm install 而不是 npm ci(2026-08-21 §20260821-03 更新):
      # package-lock.json **已入库**(迁移提交 b67ebb3 带入,与 package.json
      # 同步,npm ci --dry-run 通过),但其 resolved URL 指向国内镜像
      # registry.npmmirror.com —— 这是本地 rebuild_restart_app.sh 的 npm ci
      # 在国内网络稳定工作的关键。海外 runner 上 `npm ci` 会强制走这些
      # resolved URL(直连国内镜像,偶发不稳);而 npm >= 8 的 `npm install`
      # 会把异源 resolved 重写到当前 registry(runner 默认 npmjs.org),
      # 版本仍按 lockfile 锁定,国内外网络各走各的稳定源。
      - name: npm install
        working-directory: ClientWeb
        run: npm install --no-audit --no-fund

      # ── §20260821-03:proto TS 产物现场生成(CI 失败根因①的修复) ──
      # 必须在 npm install 之后:@protobuf-ts/plugin(devDependency)提供
      # protoc-gen-ts 插件。protoc 与 backend Job 同为钉死的 v28.3。
      - name: Install protoc (pinned v28.3)
        run: |
          curl -fsSL -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v28.3/protoc-28.3-linux-x86_64.zip
          sudo unzip -oq /tmp/protoc.zip -d /usr/local/protoc
          echo "/usr/local/protoc/bin" >> "$GITHUB_PATH"
          /usr/local/protoc/bin/protoc --version

      - name: Generate proto TypeScript code
        run: bash proto/gen.sh ts

      # tsc 是 i18n 三语同步的实际执行者:i18n/types.ts 的 Dict 契约
      # 让「locale 漏一个键」或「加了 types.ts 没加 locale」直接编译失败。
      - name: tsc --noEmit
        working-directory: ClientWeb
        run: npx tsc -b --noEmit

      - name: npm run build
        working-directory: ClientWeb
        run: npm run build

  # ---------------------------------------------------------------------------
  # 项目自检:规则文件符号链接 + §4 单文件行数上限
  # ---------------------------------------------------------------------------
  project-checks:
    name: Project conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # CLAUDE.md §10.2 原文就建议了这一步:「可在 GitHub Actions 加一步
      # test -L AGENTS.md 防止误把符号链接替换为普通文件」。
      # 一旦变成普通文件副本,两份规则会各自漂移 —— 而漂移不会报错,只会让
      # 不同 Agent 工具看到不同的项目规则。
      - name: 规则文件必须是符号链接 (§10.2)
        run: |
          test -L AGENTS.md || { echo "� AGENTS.md 不是符号链接;修复: rm AGENTS.md && ln -s CLAUDE.md AGENTS.md"; exit 1; }
          echo "✅ AGENTS.md 是符号链接"

      # CLAUDE.md §3:规则文件 ≤ 800 行。
      - name: CLAUDE.md 行数上限 (§3)
        run: |
          lines=$(wc -l < CLAUDE.md)
          echo "CLAUDE.md = ${lines} 行"
          # 现状已超 800(历史 lessons 表),此处仅设一个防失控的软天花板,
          # 避免它无声长到数千行;真正的瘦身按 §3 拆到 docs/ 后再调低本值。
          if [ "$lines" -gt 1200 ]; then
            echo "❌ CLAUDE.md ${lines} 行 > 1200 —— 请按 §3 把主题段落拆到 docs/"
            exit 1
          fi

      # CLAUDE.md §4:单文件 ≤ 1800 行(带 baseline 棘轮,见脚本头注释)。
      - name: 单文件行数上限 (§4)
        run: bash scripts/ci/check_line_limit.sh
